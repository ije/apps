[package]
name = "apps-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

# The media library without FFmpeg: it plays only WAV files, for the simpleAudio feature.
[lib]
path = "../src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
cpal = "0.18.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ffmpeg)"] }
