[package]
name = "apps-webview"
version.workspace = true
edition.workspace = true
license.workspace = true

# Linux loads the cdylib on the first system web view, so apps without one never load GTK.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
raw-window-handle = { workspace = true, features = ["std"] }
url.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
wry = { version = "=0.57.2", default-features = false, features = ["os-webview", "devtools"] }
tempfile.workspace = true
base64.workspace = true
getrandom.workspace = true
sha2.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Wry and WebKitGTK require the GTK 0.18 types.
gtk = "0.18.2"
gdkx11 = "0.18.2"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(target_os = "windows")'.dependencies]
dom_query = "0.29.0"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_WinRT"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
cc.workspace = true
