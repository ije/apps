[package]
name = "gpui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[features]
default = ["wayland", "x11", "windows-manifest"]
inspector = ["gpui_macros/inspector"]
profiler = ["dep:hdrhistogram"]
wayland = []
x11 = []
windows-manifest = ["dep:embed-resource"]

[lib]
path = "src/gpui.rs"

[dependencies]
anyhow.workspace = true
async-channel = { workspace = true, features = ["std"] }
async-task.workspace = true
avif-parse = "=2.1.0"
bitflags.workspace = true
collections.workspace = true
derive_more = { workspace = true, features = ["add", "add_assign", "mul", "mul_assign", "not"] }
etagere.workspace = true
futures.workspace = true
gpui_macros.workspace = true
gpui_shared_string.workspace = true
gpui_util.workspace = true
hdrhistogram = { workspace = true, optional = true }
heapless.workspace = true
image.workspace = true
inventory.workspace = true
itertools.workspace = true
log.workspace = true
num_cpus = "1.13"
parking = "2.0.0"
parking_lot.workspace = true
pin-project = "1.1.10"
pollster.workspace = true
profiling.workspace = true
rand = { workspace = true, features = ["small_rng", "thread_rng"] }
# The published rav1d can abort on corrupt AV1 data.
rav1d = { git = "https://github.com/memorysafety/rav1d", rev = "6c6f463785a546dea18fd9ca0f14634c2ee0557c", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
raw-window-handle.workspace = true
refineable.workspace = true
resvg.workspace = true
scheduler.workspace = true
seahash = "4.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
spin.workspace = true
strum.workspace = true
taffy = { workspace = true, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "float_layout", "content_size"] }
thiserror.workspace = true
ttf-parser = "0.25"
unicode-properties = { version = "0.1", default-features = false, features = ["emoji"] }
url.workspace = true
usvg.workspace = true
uuid = { workspace = true, features = ["v4"] }
waker-fn = "1.2.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_WindowsProgramming"] }

[build-dependencies]
embed-resource = { version = "3.0", optional = true }
