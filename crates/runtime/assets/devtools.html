<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Developer Tools</title>
<style>
:root{color-scheme:light dark;font:12px -apple-system,BlinkMacSystemFont,sans-serif;background:#202124;color:#e8eaed}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column}header{display:flex;gap:3px;padding:0 10px;border-bottom:1px solid #494a4d;background:#292a2d}button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer;padding:10px}button[aria-selected=true]{color:#8ab4f8;border-bottom:2px solid #8ab4f8}button:hover{background:#35363a}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8ab4f8;outline-offset:-2px}.toolbar{display:flex;align-items:center;gap:8px;border-bottom:1px solid #3c4043;padding:0 6px;min-height:36px}.toolbar input{flex:1;color:inherit;background:#292a2d;border:1px solid #5f6368;border-radius:3px;padding:5px}.toolbar small{color:#bdc1c6}main{flex:1;min-height:0;display:flex;flex-direction:column}.panel{display:none;flex:1;min-height:0}.panel.active{display:flex;flex-direction:column}pre,code,textarea{font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;tab-size:2}pre{margin:0;padding:10px;white-space:pre-wrap;overflow:auto}#console-output{flex:1;overflow:auto;user-select:text}.entry{padding:5px 12px;border-bottom:1px solid #303134;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.entry.error{background:#372323;color:#ffb4ab}.entry.warn{background:#383126;color:#fdd663}.entry.command{color:#8ab4f8}.entry.result{color:#a8c7fa}.console-input{display:flex;border-top:1px solid #494a4d;padding:8px;gap:8px}.console-input span{color:#8ab4f8}#expression{resize:none;flex:1;color:inherit;background:transparent;border:0;outline:0;min-height:26px}.source-layout{display:flex;flex:1;min-height:0}#source-list{width:220px;overflow:auto;border-right:1px solid #494a4d}#source-list button{display:block;width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#source-text{flex:1;white-space:pre}#status{border-top:1px solid #494a4d;padding:5px 12px;color:#bdc1c6}.notice{margin:10px;padding:10px;border:1px solid #5f6368;border-radius:4px;color:#bdc1c6}#dom{white-space:pre}.empty{padding:16px;color:#9aa0a6}
</style>
<header role="tablist" aria-label="Developer tools"><button role="tab" data-panel="elements">Elements</button><button role="tab" aria-selected="true" data-panel="console">Console</button><button role="tab" data-panel="sources">Sources</button></header>
<main>
<section id="elements" class="panel" role="tabpanel"><div class="toolbar"><button id="refresh-dom">↻ Refresh</button><input id="selector" placeholder="CSS selector" aria-label="CSS selector"><button id="inspect-element">Inspect</button></div><pre id="dom" aria-live="polite">Loading document…</pre></section>
<section id="console" class="panel active" role="tabpanel"><div class="toolbar"><button id="clear">Clear console</button><input id="filter" placeholder="Filter" aria-label="Filter console"><small id="count">0 messages</small></div><div id="console-output" role="log"></div><form class="console-input"><span>❯</span><textarea id="expression" rows="1" aria-label="JavaScript expression" placeholder="Evaluate JavaScript (Enter)"></textarea><button type="submit">Run</button></form></section>
<section id="sources" class="panel" role="tabpanel"><div class="toolbar"><button id="refresh-sources">↻ Refresh</button><button id="pause">Pause on debugger statement</button><button id="inspect-native">Open Web Inspector</button></div><div class="notice">WebKit views use Web Inspector for breakpoints and stepping. For apps JavaScript contexts, connect from Safari → Develop → this application. The context must be inspectable.</div><div class="source-layout"><nav id="source-list" aria-label="Sources"></nav><pre id="source-text">Select a source file.</pre></div></section>
</main><footer id="status" role="status">Connected to apps</footer>
<script>
(()=>{
  const pending=new Map(),history=[],messages=[];let next=0,historyIndex=0,scheduled=false;
  const status=text=>document.getElementById('status').textContent=text;
  const request=(method,params={})=>new Promise((resolve,reject)=>{const id=++next;pending.set(id,{resolve,reject});window.apps.postMessage({id,method,params});});
  const format=value=>typeof value==='string'?value:JSON.stringify(value,null,2)??String(value);
  const render=()=>{const output=document.getElementById('console-output'),filter=document.getElementById('filter').value.toLowerCase();output.replaceChildren();for(const message of messages){if(filter&&!message.text.toLowerCase().includes(filter))continue;const row=document.createElement('div');row.className='entry '+message.level;row.textContent=message.text;output.append(row)}output.scrollTop=output.scrollHeight;document.getElementById('count').textContent=messages.length+' messages';};
  const log=(level,text)=>{messages.push({level,text});if(messages.length>2000)messages.shift();if(!scheduled){scheduled=true;requestAnimationFrame(()=>{scheduled=false;render()})}};
  window.appsDevTools={receive(message){if(message.id){const item=pending.get(message.id);if(!item)return;pending.delete(message.id);if(message.error)item.reject(Error(message.error));else item.resolve(message.value);}else if(message.type==='console')log(message.level??'log',(message.args??[]).map(format).join(' '));else if(message.type==='error')log('error',message.message??format(message));}};
  const refreshDom=async()=>{try{document.getElementById('dom').textContent=format(await request('DOM.getDocument'));status('Document updated');}catch(error){status(error.message)}};
  const refreshSources=async()=>{try{const sources=await request('Sources.list'),list=document.getElementById('source-list');list.replaceChildren();for(const source of sources??[]){const button=document.createElement('button');button.textContent=source.name;button.addEventListener('click',()=>document.getElementById('source-text').textContent=source.source);list.append(button)}}catch(error){status(error.message)}};
  for(const button of document.querySelectorAll('[data-panel]'))button.addEventListener('click',()=>{for(const tab of document.querySelectorAll('[data-panel]'))tab.setAttribute('aria-selected',String(tab===button));for(const panel of document.querySelectorAll('.panel'))panel.classList.toggle('active',panel.id===button.dataset.panel);if(button.dataset.panel==='elements')refreshDom();if(button.dataset.panel==='sources')refreshSources();});
  document.getElementById('refresh-dom').onclick=refreshDom;document.getElementById('refresh-sources').onclick=refreshSources;
  document.getElementById('clear').onclick=()=>{messages.length=0;render()};document.getElementById('filter').oninput=render;
  document.getElementById('inspect-element').onclick=async()=>{try{document.getElementById('dom').textContent=format(await request('DOM.querySelector',{selector:document.getElementById('selector').value}));}catch(error){status(error.message)}};
  document.getElementById('pause').onclick=()=>request('Debugger.pause').then(value=>status(format(value))).catch(error=>status(error.message));
  document.getElementById('inspect-native').onclick=()=>request('Debugger.open').catch(error=>status(error.message));
  const expression=document.getElementById('expression');
  document.querySelector('form').onsubmit=async event=>{event.preventDefault();const source=expression.value.trim();if(!source)return;expression.value='';history.push(source);historyIndex=history.length;log('command','❯ '+source);try{const result=await request('Runtime.evaluate',{expression:source});log('result',format(result));}catch(error){log('error',error.message)}};
  expression.addEventListener('keydown',event=>{if(event.isComposing)return;if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();document.querySelector('form').requestSubmit();}else if(event.key==='ArrowUp'&&!expression.value.includes('\n')){event.preventDefault();expression.value=history[Math.max(0,--historyIndex)]??'';}else if(event.key==='ArrowDown'&&!expression.value.includes('\n')){event.preventDefault();historyIndex=Math.min(history.length,historyIndex+1);expression.value=history[historyIndex]??'';}});
  window.apps.postMessage({id:0,method:'ready',params:{}});
})();
</script></html>
