[package]
name = "apps-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apps-webview = { path = "../webview" }
anyhow.workspace = true
base64 = "0.23.1"
bbtree.workspace = true
bytes = "1.12.1"
cssparser = "0.38.0"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
gif = "0.14.2"
renderer = { package = "apps-renderer", path = "../renderer" }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27.10", default-features = false }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
libc.workspace = true
libffi = "5.2.0"
libloading = "0.9.0"
log = "0.4.35"
memmap2 = "0.9.12"
md-5 = "0.11.0"
memchr = "2.8.3"
notify = "8.2.2"
png = "0.18.1"
portable-pty = "0.9.0"
raw-window-handle.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rgb = "0.8.53"
rustc-hash.workspace = true
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
socket2 = "0.6.5"
tiny-skia.workspace = true
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "net", "io-util", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tower-service = "0.3.3"
url.workspace = true
usvg.workspace = true
zune-jpeg = "0.5.15"

[target.'cfg(not(target_os = "macos"))'.dependencies]
avif-parse = "=2.1.0"
image.workspace = true
libsqlite3-sys = { version = "0.39.1", features = ["bundled"] }
# The published rav1d can abort on corrupt AV1 data.
rav1d = { git = "https://github.com/memorysafety/rav1d", rev = "2e7216c20ac2a75de204d6c8d7268b75a45959b4", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
wuff = "0.2.10"

[target.'cfg(target_os = "linux")'.dependencies]
apps-webgpu = { path = "../webgpu" }

[[bin]]
name = "apps-runtime"
path = "src/main.rs"

[dev-dependencies]
apps-mcp = { path = "../mcp" }
apps-media = { path = "../media" }
apps-webgpu = { path = "../webgpu" }
image.workspace = true
tempfile = "3.27.0"

[build-dependencies]
cc = "1.11.1"
miniz_oxide = "0.9.1"
oxc_allocator = "=0.158.0"
oxc_codegen = "=0.158.0"
oxc_parser = { version = "=0.158.0", default-features = false }
oxc_span = "=0.158.0"
