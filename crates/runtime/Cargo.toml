[package]
name = "apps-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apps-webview = { path = "../webview" }
anyhow.workspace = true
base64 = "0.22"
bbtree.workspace = true
bytes = "1"
cssparser = "0.38"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
futures-util = "0.3"
getrandom = "0.3"
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "x11", "wayland"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
image.workspace = true
libc.workspace = true
libffi = "5.2.0"
libloading = "0.8"
libsqlite3-sys = { version = "0.39.1", features = ["bundled"] }
naga = { version = "30", features = ["termcolor"] }
notify = "8.2"
pollster.workspace = true
portable-pty = "0.9"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
resvg.workspace = true
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
sha1_smol = "1"
sha2 = "0.10"
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
url.workspace = true
wgpu = { workspace = true, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl", "serde"] }

[[bin]]
name = "apps-runtime"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"
