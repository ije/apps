[package]
name = "apps-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
bbtree.workspace = true
bytes = "1.12.1"
cpal.workspace = true
cssparser = "0.38.0"
crc32fast = "1.5.5"
flate2.workspace = true
futures-util = "0.3.34"
getrandom.workspace = true
gif = "0.14.2"
renderer = { package = "apps-renderer", path = "../renderer" }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27.10", default-features = false }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
libc.workspace = true
libffi = "5.2.0"
libloading.workspace = true
log = "0.4.35"
memmap2 = "0.9.12"
md-5 = "0.11.0"
memchr = "2.8.3"
notify.workspace = true
png = "0.18.1"
portable-pty = "0.9.0"
raw-window-handle.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rgb = "0.8.53"
rustc-hash.workspace = true
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-webpki = { version = "0.103.16", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2 = "0.6.5"
tiny-skia.workspace = true
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "net", "io-util", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tower-service = "0.3.3"
url.workspace = true
usvg.workspace = true
zune-jpeg = "0.5.15"

[target.'cfg(not(target_os = "macos"))'.dependencies]
avif-parse = "=2.1.0"
image.workspace = true
libsqlite3-sys = { version = "0.39.1", features = ["bundled"] }
# The published rav1d can abort on corrupt AV1 data.
rav1d = { git = "https://github.com/memorysafety/rav1d", rev = "2e7216c20ac2a75de204d6c8d7268b75a45959b4", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
wuff = "0.2.10"

[target.'cfg(target_os = "linux")'.dependencies]
apps-webgpu = { path = "../webgpu" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
apps-webview = { path = "../webview" }

[[bin]]
name = "apps-runtime"
path = "src/main.rs"

# Tests live in folders by layer, so each one needs an entry.
[[test]]
name = "backend"
path = "tests/app/backend.rs"

[[test]]
name = "bench"
path = "tests/app/bench.rs"

[[test]]
name = "desktop"
path = "tests/app/desktop.rs"

[[test]]
name = "startup"
path = "tests/app/startup.rs"

[[test]]
name = "child_process"
path = "tests/node/child_process.rs"

[[test]]
name = "ffi"
path = "tests/node/ffi.rs"

[[test]]
name = "napi"
path = "tests/node/napi.rs"

[[test]]
name = "sqlite"
path = "tests/node/sqlite.rs"

[[test]]
name = "browser"
path = "tests/page/browser.rs"

[[test]]
name = "compatibility"
path = "tests/page/compatibility.rs"

[[test]]
name = "dom"
path = "tests/page/dom/main.rs"

[[test]]
name = "editor"
path = "tests/page/editor.rs"

[[test]]
name = "regressions"
path = "tests/page/regressions.rs"

[[test]]
name = "render"
path = "tests/page/render/main.rs"

[[test]]
name = "images"
path = "tests/web/images.rs"

[[test]]
name = "media"
path = "tests/web/media.rs"

[[test]]
name = "serve"
path = "tests/web/serve.rs"

[[test]]
name = "terminal"
path = "tests/web/terminal.rs"

[[test]]
name = "web"
path = "tests/web/web.rs"

[[test]]
name = "webgpu"
path = "tests/web/webgpu.rs"

[dev-dependencies]
apps-devtools = { path = "../devtools" }
apps-media = { path = "../media" }
apps-terminal = { path = "../terminal" }
apps-webgpu = { path = "../webgpu" }
image.workspace = true
tempfile.workspace = true

[build-dependencies]
cc.workspace = true
miniz_oxide.workspace = true
oxc_allocator = "=0.158.0"
oxc_codegen = "=0.158.0"
oxc_mangler = "=0.158.0"
oxc_parser = { version = "=0.158.0", default-features = false }
oxc_span = "=0.158.0"
zopfli = { version = "0.8.4", default-features = false, features = ["std"] }
