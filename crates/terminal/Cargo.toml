[package]
name = "apps-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The file name of the shared library: libGhostty.dylib, libGhostty.so or Ghostty.dll.
name = "Ghostty"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc.workspace = true

[build-dependencies]
cc = "1.11.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ghostty)"] }
