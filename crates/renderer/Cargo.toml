[package]
name = "apps-renderer"
version.workspace = true
edition.workspace = true
publish.workspace = true
# Parts are derived from Zed's GPUI.
license = "Apache-2.0"

[dependencies]
anyhow.workspace = true
etagere.workspace = true
raw-window-handle.workspace = true
rustc-hash.workspace = true
taffy = { workspace = true, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics.workspace = true
core-text.workspace = true
dispatch2 = { workspace = true, features = ["block2", "objc2"] }
font-kit = { workspace = true, features = ["source"] }
foreign-types.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes"] }
objc2-core-text.workspace = true
objc2-foundation.workspace = true
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLDrawable",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }
objc2-quartz-core = { workspace = true, features = ["objc2-core-foundation", "objc2-core-graphics", "objc2-metal"] }
pathfinder_geometry.workspace = true
smallvec.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
as-raw-xcb-connection = "1"
calloop = "0.14.3"
calloop-wayland-source = "0.4.1"
cosmic-text = "0.19.0"
libc.workspace = true
pollster.workspace = true
swash.workspace = true
unicode-bidi.workspace = true
wayland-backend = { version = "0.3.15", features = ["client_system", "dlopen"] }
wayland-client = "0.31.11"
wayland-cursor = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging", "unstable"] }
wgpu = { workspace = true, features = ["std", "parking_lot", "gles", "vulkan", "wgsl"] }
x11rb = { version = "0.13.1", features = ["allow-unsafe-code", "xkb", "randr", "xinput", "cursor", "resource_manager", "sync"] }
xim = { git = "https://github.com/zed-industries/xim-rs.git", rev = "16f35a2c881b815a2b6cdfd6687988e84f8447d8", package = "zed-xim", version = "0.4.0-zed", features = ["x11rb-xcb", "x11rb-client"] }
xkbcommon = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
