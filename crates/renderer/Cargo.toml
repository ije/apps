[package]
name = "apps-renderer"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
etagere.workspace = true
raw-window-handle.workspace = true
rustc-hash.workspace = true
taffy = { workspace = true, features = ["std", "flexbox", "grid", "block_layout", "calc"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
block2.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
dispatch2 = { workspace = true, features = ["block2", "objc2"] }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSTextInputContext", "NSVisualEffectView"] }
objc2-core-foundation = { workspace = true, features = [
    "std",
    "CFArray",
    "CFAttributedString",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFPreferences",
    "CFString",
] }
objc2-core-text = { workspace = true, features = [
    "CTFontCollection",
    "CTFontManager",
    "CTFontTraits",
    "CTLine",
    "CTRun",
    "CTStringAttributes",
    "objc2-core-graphics",
] }
objc2-foundation.workspace = true
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLDrawable",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
    "MTLVertexDescriptor",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2",
    "objc2-core-graphics",
    "CVBase",
    "CVDisplayLink",
    "CVReturn",
] }
objc2-core-graphics = { workspace = true, features = [
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGFont",
    "CGImage",
] }
objc2-quartz-core = { workspace = true, features = [
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-metal",
    "CAAnimation",
    "CABase",
    "CALayer",
    "CAMediaTiming",
    "CATransaction",
    "CATransform3D",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cosmic-text = "0.19.0"
libc.workspace = true
pollster.workspace = true
swash.workspace = true
wayland-backend = { version = "0.3.17", features = ["client_system", "dlopen"] }
wayland-client = "0.31.15"
wayland-cursor = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wgpu = { workspace = true, features = ["std", "parking_lot", "gles", "vulkan", "wgsl"] }
x11rb = { version = "0.14.0", features = ["allow-unsafe-code", "xkb", "randr", "xinput", "cursor", "resource_manager", "sync"] }
xim = { version = "0.6.0", default-features = false, features = ["x11rb-xcb", "x11rb-client"] }
xkbcommon = { workspace = true, features = ["x11", "wayland"] }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }

# The build script runs on the host, and only a macOS host builds Metal shaders.
[target.'cfg(target_os = "macos")'.build-dependencies]
miniz_oxide = "0.9.1"
naga = { version = "30.0.1", features = ["wgsl-in", "msl-out"] }
