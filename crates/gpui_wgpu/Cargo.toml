[package]
name = "gpui_wgpu"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_wgpu.rs"
doctest = false

[features]
font-kit = ["dep:font-kit"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
anyhow.workspace = true
collections.workspace = true
cosmic-text = "0.19.0"
etagere.workspace = true
font-kit = { workspace = true, optional = true }
gpui.workspace = true
gpui_util.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
profiling.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
swash.workspace = true
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
wgpu = { workspace = true, features = ["std", "parking_lot", "gles", "vulkan", "wgsl"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
