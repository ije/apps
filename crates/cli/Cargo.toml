[package]
name = "apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "apps"
path = "src/main.rs"

[dependencies]
apps-runtime = { path = "../runtime" }
anyhow.workspace = true
base64 = "0.22"
bbtree.workspace = true
ctrlc = "3"
libloading = "0.8"
notify = "8"
object = { version = "0.39.1", default-features = false, features = ["read_core", "std", "elf", "macho", "pe"] }
oxc_allocator = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_ast_visit = "=0.155.0"
oxc_codegen = "=0.155.0"
oxc_minifier = "=0.155.0"
oxc_parser = { version = "=0.155.0", default-features = false }
# Keep this tag in sync with oxc above. crates.io stops at 0.143.0.
oxc_react_compiler = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.155.0" }
oxc_semantic = "=0.155.0"
oxc_sourcemap = "=9.0.0"
oxc_span = "=0.155.0"
oxc_transformer = "=0.155.0"
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3"
url.workspace = true
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
apps-media = { path = "../media" }
apps-webgpu = { path = "../webgpu" }
