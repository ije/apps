[package]
name = "apps-webgpu"
version.workspace = true
edition.workspace = true
license.workspace = true

# Linux links the rlib, because the renderer already uses wgpu there.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu = { workspace = true, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl", "serde"] }
