[workspace]
members = ["crates/*"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[package]
name = "pierre-apps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A tiny, fast, memory-safe Electron alternative with a compatible API"
repository = "https://github.com/ije/apps"
readme = "README.md"
publish = ["crates-io"]
include = ["/src/**", "/README.md", "/LICENSE.md"]

[dependencies]
apps-runtime = { version = "0.0.0", path = "crates/runtime" }

[workspace.dependencies]
anyhow = "1.0.104"
bbtree = "0.2.1"
block2 = "0.6.2"
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
etagere = "0.3.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSDragging",
    "NSEvent",
    "NSGraphics",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSTextInputClient",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "block2",
    "objc2-core-foundation",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSArray",
    "NSAttributedString",
    "NSGeometry",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSString",
    "NSURL",
    "NSUserDefaults",
    "NSValue",
    "objc2-core-foundation",
    "std",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace", "objc2"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }
pollster = "1.0.1"
raw-window-handle = "0.6.2"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
swash = "0.2.10"
taffy = { version = "0.15.1", default-features = false }
tiny-skia = "0.12.0"
url = "2.5.8"
usvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "svgz"] }
wgpu = { version = "30.0.1", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# windows-core must match the types and macros in windows.
windows-core = "0.62.2"
xkbcommon = { version = "0.9.0", default-features = false }

# Use the bundler's crates.io oxc dependencies for oxc_react_compiler.
[patch."https://github.com/oxc-project/oxc"]
oxc_allocator = "0.158.0"
oxc_ast = "0.158.0"
oxc_ast_macros = "0.158.0"
oxc_ast_visit = "0.158.0"
oxc_data_structures = "0.158.0"
oxc_diagnostics = "0.158.0"
oxc_ecmascript = "0.158.0"
oxc_estree = "0.158.0"
oxc_regular_expression = "0.158.0"
oxc_semantic = "0.158.0"
oxc_span = "0.158.0"
oxc_str = "0.158.0"
oxc_syntax = "0.158.0"

# Rust apps copy the profiles from here to the end of the file.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.apps-runtime]
opt-level = 2

# Optimize these crates for size. None runs per frame.

[profile.release.package.apps-webview]
opt-level = "s"

[profile.release.package.naga]
opt-level = "s"

[profile.release.package.libsqlite3-sys]
opt-level = "s"

[profile.release.package.rustls]
opt-level = "s"

[profile.release.package.rustls-webpki]
opt-level = "s"

[profile.release.package.usvg]
opt-level = "s"

[profile.release.package.roxmltree]
opt-level = "s"

[profile.release.package.hyper]
opt-level = "s"

[profile.release.package.hyper-util]
opt-level = "s"

[profile.release.package.http]
opt-level = "s"

[profile.release.package.url]
opt-level = "s"

[profile.release.package.idna]
opt-level = "s"

[profile.release.package.tungstenite]
opt-level = "s"

[profile.release.package.rav1d]
opt-level = "s"

[profile.release.package.tokio]
opt-level = "s"

[profile.release.package.tokio-rustls]
opt-level = "s"

[profile.release.package.tokio-tungstenite]
opt-level = "s"

[profile.release.package.futures-util]
opt-level = "s"

[profile.release.package.rustls-pki-types]
opt-level = "s"

[profile.release.package.rustls-native-certs]
opt-level = "s"

[profile.release.package.icu_normalizer]
opt-level = "s"

[profile.release.package.notify]
opt-level = "s"

[profile.release.package.portable-pty]
opt-level = "s"

[profile.release.package.anyhow]
opt-level = "s"

[profile.release.package.fontdb]
opt-level = "s"

[profile.release.package.svgtypes]
opt-level = "s"

[profile.release.package.simplecss]
opt-level = "s"

[profile.release.package.data-url]
opt-level = "s"

# avif-parse asserts on truncated input before returning its decoding error.
[profile.dev.package.avif-parse]
debug-assertions = false
