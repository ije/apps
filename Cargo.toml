[package]
name = "apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "apps"
path = "src/main.rs"

[dependencies]
apps-runtime = { path = "crates/runtime" }
anyhow.workspace = true
base64 = "0.22"
bbtree.workspace = true
ctrlc = "3"
notify = "8"
object = { version = "0.39.1", default-features = false, features = ["read_core", "std", "elf", "macho", "pe"] }
oxc_allocator = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_ast_visit = "=0.155.0"
oxc_codegen = "=0.155.0"
oxc_minifier = "=0.155.0"
oxc_parser = { version = "=0.155.0", default-features = false }
oxc_semantic = "=0.155.0"
oxc_span = "=0.155.0"
oxc_transformer = "=0.155.0"
serde_json.workspace = true
tempfile = "3"
url.workspace = true
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
oxc_sourcemap = "=9.0.0"

[build-dependencies]
cc = "1"

[workspace]
members = ["crates/*", "crates/refineable/derive_refineable"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
collections = { path = "crates/collections" }
derive_refineable = { path = "crates/refineable/derive_refineable" }
gpui = { path = "crates/gpui", default-features = false }
gpui_apple = { path = "crates/gpui_apple" }
gpui_linux = { path = "crates/gpui_linux", default-features = false }
gpui_macos = { path = "crates/gpui_macos", default-features = false }
gpui_macros = { path = "crates/gpui_macros" }
gpui_platform = { path = "crates/gpui_platform", default-features = false }
gpui_shared_string = { path = "crates/gpui_shared_string" }
gpui_util = { path = "crates/gpui_util" }
gpui_wgpu = { path = "crates/gpui_wgpu" }
gpui_windows = { path = "crates/gpui_windows", default-features = false }
refineable = { path = "crates/refineable" }
scheduler = { path = "crates/scheduler" }

anyhow = "1"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "inhibit", "open_uri", "file_chooser", "settings"] }
async-channel = { version = "2.5", default-features = false }
async-task = "4.7"
bbtree = "=0.1.5"
bitflags = "2.6.0"
block2 = "0.6"
bytemuck = "1"
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
ctor = "1.0.12"
derive_more = { version = "2.1", features = ["deref", "deref_mut", "from_str"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
dunce = "1.0"
etagere = "0.2"
flume = { version = "0.12", default-features = false, features = ["async"] }
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", default-features = false }
foreign-types = "0.5"
futures = "0.3.34"
hdrhistogram = { version = "7", default-features = false }
heapless = "0.9.2"
heck = "0.5"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
indexmap = { version = "2.7.0", features = ["serde"] }
inventory = "0.3.19"
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4", default-features = false, features = ["std"] }
mach2 = "0.6"
notify-rust = "4"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSDocumentController",
    "NSDragging",
    "NSDraggingItem",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSScroller",
    "NSTrackingArea",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "block2",
    "objc2-core-foundation",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGDirectDisplay"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBuffer", "CVImageBuffer"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSCoder",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNull",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSSet",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
    "std",
] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "SecBase", "SecItem"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTCoreTypes", "UTType"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
oo7 = { git = "https://github.com/zed-industries/oo7", rev = "731c1215edb6905876c6137ab300428c7b8d7c13", version = "0.6", default-features = false }
parking_lot = "0.12.1"
pathfinder_geometry = "0.5"
pollster = "0.4.0"
proc-macro2 = "1.0.93"
profiling = "1"
quote = "1.0.9"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
raw-window-handle = "0.6"
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
rustc-hash = "2.1.0"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
smol = "2.0"
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "lock_api"] }
strum = { version = "0.28", features = ["derive"] }
swash = "0.2.6"
syn = { version = "2.0", default-features = false, features = ["proc-macro"] }
taffy = { version = "=0.15.0", default-features = false }
thiserror = "2.0.12"
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
unicode-segmentation = "1.10"
url = "2.5"
usvg = { version = "0.46.0", default-features = false }
uuid = { version = "1.1", features = ["serde"] }
wgpu = { version = "30.0.1", default-features = false }
which = "8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-registry = "0.6.0"
xkbcommon = { version = "0.8", default-features = false }

[workspace.lints.rust]
unexpected_cfgs = "allow"

# Only the vendored GPUI crates use these. They keep Zed's style, so style lints are off.
[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
style = { level = "allow", priority = -1 }
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[patch.crates-io]
# Zed's forks that gpui depends on.
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
# Avoid panicking when a failed EGL call reports EGL_SUCCESS.
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.apps-runtime]
opt-level = 2

[profile.release.package.apps-webview]
opt-level = "s"

# avif-parse asserts on truncated input before returning its decoding error.
[profile.dev.package.avif-parse]
debug-assertions = false
