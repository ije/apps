[workspace]
members = ["crates/*"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
bbtree = "=0.1.5"
block2 = "0.6"
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
etagere = "0.2"
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", default-features = false }
foreign-types = "0.5"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSDragging",
    "NSEvent",
    "NSGraphics",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSTextInputClient",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "block2",
    "objc2-core-foundation",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSArray",
    "NSAttributedString",
    "NSGeometry",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSString",
    "NSURL",
    "NSUserDefaults",
    "NSValue",
    "objc2-core-foundation",
    "std",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace", "objc2"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }
pathfinder_geometry = "0.5"
pollster = "0.4.0"
raw-window-handle = "0.6"
rustc-hash = "2.1.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
swash = "0.2.6"
taffy = { version = "=0.15.0", default-features = false }
tiny-skia = "0.11.4"
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
url = "2.5"
usvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
wgpu = { version = "30.0.1", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
xkbcommon = { version = "0.8", default-features = false }

# WARNING: oxc_react_compiler comes from git, so its oxc crates must be the crates.io ones that the bundler uses.
# It stays above [patch.crates-io], because Rust apps copy the rest of this file.
[patch."https://github.com/oxc-project/oxc"]
oxc_allocator = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_ast_macros = "=0.155.0"
oxc_ast_visit = "=0.155.0"
oxc_data_structures = "=0.155.0"
oxc_diagnostics = "=0.155.0"
oxc_ecmascript = "=0.155.0"
oxc_estree = "=0.155.0"
oxc_regular_expression = "=0.155.0"
oxc_semantic = "=0.155.0"
oxc_span = "=0.155.0"
oxc_str = "=0.155.0"
oxc_syntax = "=0.155.0"

[patch.crates-io]
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
# WARNING: this fork avoids a panic when a failed EGL call reports EGL_SUCCESS.
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.apps-runtime]
opt-level = 2

# WARNING: these crates build for size to keep the runtime under 10 MB. None of them runs per frame.

[profile.release.package.apps-webview]
opt-level = "s"

[profile.release.package.naga]
opt-level = "s"

[profile.release.package.libsqlite3-sys]
opt-level = "s"

[profile.release.package.rustls]
opt-level = "s"

[profile.release.package.rustls-webpki]
opt-level = "s"

[profile.release.package.usvg]
opt-level = "s"

[profile.release.package.roxmltree]
opt-level = "s"

[profile.release.package.hyper]
opt-level = "s"

[profile.release.package.hyper-util]
opt-level = "s"

[profile.release.package.http]
opt-level = "s"

[profile.release.package.url]
opt-level = "s"

[profile.release.package.idna]
opt-level = "s"

[profile.release.package.tungstenite]
opt-level = "s"

[profile.release.package.rav1d]
opt-level = "s"

[profile.release.package.rustybuzz]
opt-level = "s"

[profile.release.package.tokio]
opt-level = "s"

[profile.release.package.tokio-rustls]
opt-level = "s"

[profile.release.package.tokio-tungstenite]
opt-level = "s"

[profile.release.package.futures-util]
opt-level = "s"

[profile.release.package.rustls-pki-types]
opt-level = "s"

[profile.release.package.rustls-native-certs]
opt-level = "s"

[profile.release.package.icu_normalizer]
opt-level = "s"

[profile.release.package.notify]
opt-level = "s"

[profile.release.package.portable-pty]
opt-level = "s"

[profile.release.package.anyhow]
opt-level = "s"

[profile.release.package.fontdb]
opt-level = "s"

[profile.release.package.svgtypes]
opt-level = "s"

[profile.release.package.simplecss]
opt-level = "s"

[profile.release.package.data-url]
opt-level = "s"

# WARNING: avif-parse asserts on truncated input before returning its decoding error.
[profile.dev.package.avif-parse]
debug-assertions = false
