[workspace]
members = ["crates/apps", "crates/webview", "crates/runtime"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
bbtree = "=0.1.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.apps-runtime]
opt-level = 2

[profile.release.package.apps-webview]
opt-level = "s"

# avif-parse asserts on truncated input before returning its decoding error.
[profile.dev.package.avif-parse]
debug-assertions = false
