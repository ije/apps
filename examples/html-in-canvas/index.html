<!doctype html>
<html>
<head>
  <title>HTML in Canvas</title>
  <style>
    html, body { height: 100%; margin: 0; background: #06475f; }
    canvas { display: block; width: 100%; height: 100%; }
    .card { width: 300px; padding: 24px; border-radius: 18px; background: #fff; color: #1c2233; font: 15px/1.5 system-ui; }
    .card h1 { margin: 0 0 6px; font-size: 24px; }
    .card p { margin: 0 0 16px; color: #5b6478; }
    .card label { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
    .card input { flex: 1; min-width: 0; font: inherit; }
    .card input[type=text] { padding: 6px 10px; border: 1px solid #c9cfdc; border-radius: 8px; }
    .card input[type=text]:focus { outline: 2px solid #1596b8; }
  </style>
</head>
<body>
  <!-- The canvas lays out its children, and a WebGPU shader draws the one with the `drawable` attribute. -->
  <canvas content="drawable">
    <form class="card" drawable>
      <h1>Hello, <span id="who">water</span>!</h1>
      <p>This card is HTML under a water surface. A shader bends it, and it still takes the pointer and the keyboard.</p>
      <label>Name <input id="name" type="text" value="water"></label>
      <label>Waves <input id="waves" type="range" min="0" max="100" value="40"></label>
    </form>
  </canvas>
  <script type="module" src="./page.js"></script>
</body>
</html>
