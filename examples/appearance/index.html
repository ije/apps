<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Appearance</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body class="m-0 px-8 py-6">
    <h1 class="m-0 mb-1 text-[22px] font-semibold">Appearance</h1>
    <p class="m-0 mb-5 text-[GrayText]">
      <code>appearance: system</code> or the <code>appearance-system</code> class shows AppKit controls on macOS.
      On other platforms it is <code>auto</code>.
    </p>
    <form id="form" class="grid grid-cols-[90px_1fr_1fr] items-center justify-items-start gap-x-4 gap-y-3">
      <span></span>
      <b>auto</b>
      <b>system</b>

      <label class="justify-self-end">Text</label>
      <input type="text" placeholder="Your name" class="w-44">
      <input type="text" name="name" placeholder="Your name" class="appearance-system w-44">

      <label class="justify-self-end">Search</label>
      <input type="search" placeholder="Search" class="w-44">
      <input type="search" name="search" placeholder="Search" class="appearance-system w-44">

      <label class="justify-self-end">Switch</label>
      <input type="checkbox" switch checked>
      <div class="flex items-center gap-2.5">
        <input id="wifi" type="checkbox" name="wifi" switch checked class="appearance-system">
        <output id="wifi-state">On</output>
      </div>

      <label class="justify-self-end">Range</label>
      <input type="range" min="0" max="100" value="40" class="w-44">
      <div class="flex items-center gap-2.5">
        <input id="volume" type="range" name="volume" min="0" max="100" value="40" class="appearance-system w-44">
        <output id="volume-value">40</output>
      </div>

      <label class="justify-self-end">Number</label>
      <input type="number" min="1" max="10" value="2" class="w-16">
      <div class="flex items-center gap-2.5">
        <input id="copies" type="number" name="copies" min="1" max="10" value="2" class="appearance-system">
        <output id="copies-value">2</output>
      </div>

      <label class="justify-self-end">Color</label>
      <input type="color" value="#007aff">
      <div class="flex items-center gap-2.5">
        <input id="color" type="color" name="color" value="#007aff" class="appearance-system">
        <output id="color-value">#007aff</output>
      </div>

      <label class="justify-self-end">Date</label>
      <input type="date" value="2026-11-09">
      <input type="date" name="date" value="2026-11-09" min="2000-01-01" max="2099-12-31" class="appearance-system">

      <label class="justify-self-end">Button</label>
      <input type="button" value="Save">
      <div class="system flex items-center gap-2.5">
        <input id="save" type="button" value="Save">
        <input type="button" value="Disabled" disabled>
      </div>
    </form>
    <pre id="log" class="mt-5 mb-0 h-28 overflow-auto rounded-lg bg-[light-dark(#f2f2f2,#2a2a2a)] px-2.5 py-2 font-mono text-[11px] whitespace-pre-wrap"></pre>
    <script type="module">
      const $ = (id) => document.getElementById(id);
      const log = (text) => {
        $('log').textContent = `${text}\n${$('log').textContent}`.split('\n').slice(0, 40).join('\n');
      };
      const value = (input) => (input.type === 'checkbox' ? input.checked : input.value);
      for (const input of document.querySelectorAll('input')) {
        input.addEventListener('change', () => log(`change ${input.type} ${value(input)}`));
      }
      $('wifi').addEventListener('change', () => ($('wifi-state').textContent = $('wifi').checked ? 'On' : 'Off'));
      for (const id of ['volume', 'copies', 'color']) {
        $(id).addEventListener('input', () => ($(`${id}-value`).textContent = $(id).value));
      }
      $('save').addEventListener('click', () => log(`click  Save ${JSON.stringify(Object.fromEntries(new FormData($('form'))))}`));
    </script>
  </body>
</html>
