<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Liquid Glass</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="flex min-h-screen flex-col items-center justify-center gap-8 p-12">
      <div class="text-center">
        <h1 class="text-4xl font-semibold">Liquid Glass</h1>
        <p class="mt-3">Native macOS material. HTML controls.</p>
      </div>
      <div class="flex gap-8">
        <button id="plain" class="bg-glass bg-glass-interactive rounded-full px-6 py-3 text-lg">Count 0</button>
        <button id="tinted" class="bg-glass-blue-500 bg-glass-interactive rounded-full px-6 py-3 text-lg">Blue</button>
        <button id="clear" class="bg-glass-clear bg-glass-interactive rounded-xl px-6 py-3 text-lg">Clear</button>
      </div>
      <button id="mouse" type="button" aria-pressed="false" class="bg-glass bg-glass-interactive rounded-full flex items-center gap-2 px-6 py-3 text-lg">
        <sf-symbol-magicmouse class="size-5" aria-hidden="true" />
        <span id="mouse-label">Magic Mouse OFF</span>
      </button>
      <p class="flex items-center gap-2 text-sm">
        <sf-symbol-info-circle class="size-4" aria-hidden="true" />
        <span id="status">Click a button to test DOM events.</span>
      </p>
    </main>
    <script type="module">
      import { on, send } from './preload.js';

      const mouse = document.querySelector('#mouse');
      mouse.addEventListener('click', () => send('mouse-toggle'));
      on('mouse-state', (enabled) => {
        mouse.setAttribute('aria-pressed', String(enabled));
        document.querySelector('#mouse-label').textContent = `Magic Mouse ${enabled ? 'ON' : 'OFF'}`;
      });
      send('mouse-ready');

      let count = 0;
      document.querySelector('#plain').addEventListener('click', (event) => {
        event.currentTarget.textContent = `Count ${++count}`;
        document.querySelector('#status').textContent = `Clicked ${count} time${count === 1 ? '' : 's'}.`;
      });
      document.querySelector('#tinted').addEventListener('click', (event) => {
        const green = event.currentTarget.classList.toggle('bg-glass-green-500');
        event.currentTarget.classList.toggle('bg-glass-blue-500', !green);
        event.currentTarget.textContent = green ? 'Green' : 'Blue';
      });
      document.querySelector('#clear').addEventListener('click', () => {
        const button = document.querySelector('#plain');
        button.classList.toggle('bg-glass');
        document.querySelector('#status').textContent = button.classList.contains('bg-glass') ? 'Glass enabled.' : 'Glass removed.';
      });
    </script>
  </body>
</html>
