<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Magic Mouse</title>
    <link rel="stylesheet" href="./float.css">
  </head>
  <body>
    <main id="float">
      <section class="bg-glass-clear float-pill" aria-label="Magic Mouse connection">
        <svg class="device-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="6"/></svg>
        <div class="device-label">
          <h1>Magic Mouse</h1>
          <p id="device-state" role="status" aria-live="polite">Off</p>
        </div>
        <div class="battery" aria-label="Battery 13 percent">
          <svg viewBox="0 0 56 56" aria-hidden="true">
            <circle class="battery-track" cx="28" cy="28" r="24" />
            <path class="battery-level" d="M28 4 A24 24 0 0 1 45.5 11.57" />
          </svg>
          <span>13</span>
        </div>
      </section>
      <button id="close" class="bg-glass bg-glass-interactive" type="button" aria-label="Close notification">
        <svg viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M1 1l6 6M7 1L1 7"/></svg>
      </button>
    </main>
    <script type="module" src="./float.js"></script>
  </body>
</html>
