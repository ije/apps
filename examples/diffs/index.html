<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Diffs + apps</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <p class="eyebrow">PIERRE DIFFS + HIGHLIGHTS</p>
    <h1>Review and edit a change</h1>
    <p class="intro">Compare two TypeScript files, then edit the new file in place.</p>
    <div class="toolbar" aria-label="Diff options">
      <button id="layout" disabled>Use unified view</button>
      <button id="theme" disabled>Use dark theme</button>
      <button id="reset" disabled>Reset</button>
    </div>
    <diffs-container id="diff">
      <div id="diff-header" class="diff-header">
        <div class="header-file">
          <svg class="file-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="2" width="14" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="9" r="3" fill="currentColor"/></svg>
          <span id="filename"></span>
        </div>
        <div class="header-actions">
          <span id="deletions" class="deletions"></span>
          <span id="additions" class="additions"></span>
          <button id="edit" aria-pressed="false" disabled>Edit</button>
        </div>
      </div>
    </diffs-container>
    <p id="status" role="status">Load Highlights…</p>
  </main>
  <script type="module" src="./page.ts"></script>
</body>
</html>
