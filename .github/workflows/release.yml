name: Release
on:
  push:
    tags: ['v*']
    # Tags can reuse only main's caches. Build the native libraries on main when their scripts change.
    branches: [main]
    paths: ['scripts/**', crates/media/native/ffmpeg.c, '.github/actions/**', .github/workflows/release.yml]
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      # A failed target must not stop the others before they save their caches.
      fail-fast: false
      matrix:
        include:
          # Bun's AOT sources need the Clang 21 of this image. The Clang 17 of macos-15 rejects them.
          - { target: darwin-arm64, os: macos-26, aot: true }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: win32-x64, os: windows-2025 }
          - { target: win32-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'macOS'
        run: xcrun -sdk macosx metal --version || { xcodebuild -downloadComponent MetalToolchain && xcrun -sdk macosx metal --version; }
      - uses: ./.github/actions/native
        with:
          aot: ${{ matrix.aot }}
      - run: bash scripts/build-npm.sh "$([[ $GITHUB_REF_TYPE == tag ]] && echo "${GITHUB_REF_NAME#v}" || echo 0.0.0)"
      # A broken package must not reach npm: the packed CLI must start and build an app from the packed files.
      - run: |
          bin=packages/apps-${{ matrix.target }}/bin
          "$bin/apps" --version
          "$bin/apps" build examples/serve/main.ts --out-dir target/smoke
      # The packed runtime must also start that app. CI doesn't run --check on Windows yet, so it is left out there.
      - if: runner.os != 'Windows'
        run: packages/apps-${{ matrix.target }}/bin/apps-runtime "$(dirname "$(find target/smoke -name app.bundle)")" --check
      - run: |
          mkdir npm
          npm pack ./packages/apps-${{ matrix.target }} --pack-destination npm
          [[ ${{ matrix.target }} != linux-x64 ]] || npm pack ./packages/apps --pack-destination npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: npm/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: npm
          merge-multiple: true
      # Publish platform packages before @pierre/apps references them.
      - run: |
          tag=
          [[ $GITHUB_REF_NAME == *-* ]] && tag=--tag=next
          for file in npm/pierre-apps-{darwin,linux,win32}-*.tgz npm/pierre-apps-[0-9]*.tgz; do
            spec=$(tar -xzOf "$file" package/package.json | jq -r '.name + "@" + .version')
            if npm view "$spec" version >/dev/null 2>&1; then echo "$spec is already published"; continue; fi
            npm publish "$file" --access public $tag
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
