name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The same Linux and Windows images as release.yml, so both workflows share the native library caches.
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/native
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a cargo test -p apps-webview --lib wry::tests::system_webview --locked -- --ignored --test-threads=1
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
      - if: runner.os == 'Windows'
        run: cargo test -p apps-webview --lib wry::tests::system_webview --locked -- --ignored --test-threads=1
